<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Importar do iFood</title>
  <style>
    body { font: 13px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; width: 360px; background: #111; color: #eee; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #fff; }
    p { margin: 0 0 8px; color: #aaa; font-size: 12px; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 9px 10px; border-radius: 6px; border: 0; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: #bd0f10; color: #fff; }
    .ghost { background: #222; color: #ddd; border: 1px solid #333; }
    .stat { margin-top: 10px; padding: 8px 10px; background: #1a1a1a; border-radius: 6px; border: 1px solid #2a2a2a; }
    .ok { color: #4ade80; }
    .warn { color: #fbbf24; }
    .dbg { margin-top: 8px; padding: 6px 8px; background: #0a0a0a; border-radius: 4px; font-size: 10px; color: #666; font-family: monospace; word-break: break-all; }
    code { background: #222; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Importar catálogo do iFood <small style="color:#777">v1.2</small></h1>
  <p>1. Abra a página da sua loja no iFood ou o Portal do Parceiro em <b>Cardápio</b>.</p>
  <p>2. Role até o fim para carregar todos os produtos visíveis.</p>
  <p>3. A extensão agora também lê os cards da tela, mesmo se não capturar requisições.</p>
  <div class="stat" id="stat">Carregando…</div>
  <div class="dbg" id="dbg">—</div>
  <div class="row">
    <button class="ghost" id="btn-clear">Limpar</button>
    <button class="primary" id="btn-export" disabled>Exportar JSON</button>
  </div>
  <div class="row">
    <button class="ghost" id="btn-export-raw">Exportar capturas brutas (debug)</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
